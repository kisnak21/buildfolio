<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms & Auth - Buildfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Public Sans"', 'sans-serif'] },
          colors: {
            bgMain: '#Fdfcf7',
            primary: '#FF90E8',
            secondary: '#FFC900',
            accent: '#23A094',
            dark: '#111111',
          },
          boxShadow: {
            'brutal-sm': '2px 2px 0px 0px rgba(17,17,17,1)',
            'brutal': '4px 4px 0px 0px rgba(17,17,17,1)',
            'brutal-lg': '8px 8px 0px 0px rgba(17,17,17,1)',
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: theme('colors.bgMain'); color: theme('colors.dark'); }
    .btn-brutal { transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .btn-brutal:active { transform: translate(4px, 4px) !important; box-shadow: 0px 0px 0px 0px rgba(17,17,17,1) !important; }
    
    /* Input focus styles */
    .input-brutal:focus { outline: none; border-color: theme('colors.primary'); box-shadow: 4px 4px 0px 0px theme('colors.primary'); }
  </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-4xl grid md:grid-cols-2 gap-8">
    
    <!-- AUTH FORM (Login) -->
    <div class="bg-white border-4 border-dark rounded-2xl p-8 shadow-brutal-lg relative">
      <!-- Decorative element -->
      <div class="absolute -top-4 -right-4 w-12 h-12 bg-secondary border-4 border-dark rounded-full shadow-brutal flex items-center justify-center font-bold text-xl">
        👋
      </div>

      <h2 class="text-3xl font-black mb-2">Welcome Back</h2>
      <p class="font-medium text-gray-600 mb-8">Log in to manage your projects.</p>

      <form class="space-y-5">
        <div>
          <label class="block font-bold mb-2">Email</label>
          <input type="email" placeholder="you@example.com" class="input-brutal w-full px-4 py-3 bg-[#f3f4f6] border-2 border-dark rounded-xl font-medium transition-shadow">
        </div>
        <div>
          <label class="block font-bold mb-2">Password</label>
          <input type="password" placeholder="••••••••" class="input-brutal w-full px-4 py-3 bg-[#f3f4f6] border-2 border-dark rounded-xl font-medium transition-shadow">
        </div>

        <button type="button" class="btn-brutal w-full bg-primary text-dark border-2 border-dark py-4 rounded-xl font-black text-lg shadow-brutal mt-4">
          Log In
        </button>
      </form>

      <div class="mt-8 pt-6 border-t-2 border-dark border-dashed text-center">
        <p class="font-bold mb-4">Or continue with</p>
        <button class="btn-brutal w-full bg-white border-2 border-dark py-3 rounded-xl font-bold shadow-brutal-sm flex items-center justify-center gap-2">
          <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="currentColor" d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg>
          Google
        </button>
      </div>
    </div>

    <!-- PROJECT FORM (Add/Edit) -->
    <div class="bg-[#c4f0ff] border-4 border-dark rounded-2xl p-8 shadow-brutal-lg">
      <h2 class="text-2xl font-black mb-6">Create Project</h2>

      <form class="space-y-4">
        <div>
          <label class="block font-bold mb-2">Project Title</label>
          <input type="text" placeholder="E.g. DevFlow" class="input-brutal w-full px-4 py-3 bg-white border-2 border-dark rounded-xl font-bold shadow-brutal-sm transition-shadow">
        </div>
        
        <div>
          <label class="block font-bold mb-2">Category</label>
          <select class="input-brutal w-full px-4 py-3 bg-white border-2 border-dark rounded-xl font-bold shadow-brutal-sm appearance-none cursor-pointer">
            <option>SaaS</option>
            <option>AI</option>
            <option>Web App</option>
          </select>
        </div>

        <div>
          <label class="block font-bold mb-2">Description</label>
          <textarea rows="3" placeholder="What does your project do?" class="input-brutal w-full px-4 py-3 bg-white border-2 border-dark rounded-xl font-medium shadow-brutal-sm resize-none"></textarea>
        </div>

        <div>
          <label class="block font-bold mb-2">Technologies</label>
          <input type="text" placeholder="React, Tailwind, Node.js" class="input-brutal w-full px-4 py-3 bg-white border-2 border-dark rounded-xl font-medium shadow-brutal-sm">
        </div>

        <div class="pt-4 flex justify-end gap-3">
          <button type="button" class="btn-brutal bg-white border-2 border-dark px-6 py-3 rounded-xl font-bold shadow-brutal">
            Cancel
          </button>
          <button type="button" class="btn-brutal bg-dark text-white border-2 border-dark px-6 py-3 rounded-xl font-bold shadow-brutal">
            Publish
          </button>
        </div>
      </form>
    </div>

  </div>

</body>
</html>
